:root {
  --brand: #182C4D;
  --brand-dark: #0F1D33;
  --ink-head: #16233B;
  --brand-panel: #24365A;
  --bronze: #A8791A;
  --bronze-dark: #8A6215;
  --gold-hi: #EAC148;
  --bg: #F4F2ED;
  --card: #FFFFFF;
  --surface-2: #EAE6DD;
  --surface-3: #E1DCD1;
  --text: #2C3138;
  --text-2: #5A616B;
  --text-3: #858C96;
  --line: #DCD7CB;
  --line-soft: #EFEBE2;
  --good: #2E6B41;
  --good-bg: #E4EDE4;
  --warn: #B4661C;
  --warn-bg: #F5E9D8;
  --bad: #A33A32;
  --bad-bg: #F6E7E4;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --st-display: "Bricolage Grotesque", system-ui, sans-serif;
  --st-body: "Archivo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--st-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* TOPBAR */
.topbar {
  background: var(--brand);
  color: #fff;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--bronze);
  flex-wrap: wrap;
  gap: 10px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-left img { height: 26px; width: auto; display: block; }
.brand-text { font-size: 14px; opacity: 0.95; font-family: var(--st-display); }
.brand-text b { letter-spacing: 0.3px; }
.brand-text .sep { opacity: 0.5; margin: 0 6px; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.topbar-actions button {
  background: rgba(255,255,255,0.10);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.20);
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.topbar-actions button:hover { background: rgba(255,255,255,0.20); }
.topbar-actions button.primary { background: var(--bronze); border-color: var(--bronze-dark); font-weight: 600; }
.topbar-actions button.primary:hover { background: var(--bronze-dark); }

/* SHELL */
.shell { width: 100%; max-width: min(1280px, 94%); margin: 0 auto; padding: clamp(20px, 3vw, 36px) clamp(14px, 2vw, 32px) 80px; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: clamp(20px, 3vw, 30px); box-shadow: var(--shadow); margin-bottom: 16px; }
.page-header { margin-bottom: 20px; }
.eyebrow { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; color: var(--bronze); margin-bottom: 6px; text-transform: uppercase; font-family: var(--st-body); }
h1 { font-family: var(--st-display); font-size: 26px; margin: 0 0 6px; color: var(--ink-head); letter-spacing: -0.2px; }
h2 { font-family: var(--st-display); font-size: 18px; margin: 0 0 12px; color: var(--ink-head); letter-spacing: -0.2px; }
h3 { font-family: var(--st-display); font-size: 15px; margin: 0 0 6px; color: var(--text); font-weight: 700; }
p { margin: 0 0 12px; color: var(--text-2); }
.muted { color: var(--text-3); font-size: 13px; }

/* EMPTY STATE / DROPZONE */
.dropzone {
  border: 2px dashed var(--line);
  border-radius: 12px;
  padding: 48px 24px;
  text-align: center;
  background: var(--card);
  transition: border-color 0.15s, background 0.15s;
  margin-bottom: 16px;
}
.dropzone.dragover { border-color: var(--bronze); background: #FBF6EA; }
.dropzone .icon { font-size: 36px; margin-bottom: 12px; color: var(--ink-head); }
.dropzone h2 { margin-bottom: 6px; }
.dropzone .file-input { display: inline-block; margin-top: 12px; }
.dropzone .file-input button {
  background: var(--bronze);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.dropzone .file-input button:hover { background: var(--bronze-dark); }

/* KPI ROW */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.kpi .v { font-family: var(--st-display); font-size: 22px; font-weight: 700; color: var(--ink-head); }
.kpi .l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

/* DEPARTMENT SECTION HEADERS (roster, organised by the platform's framework) */
.dept-section { margin-top: 22px; }
.dept-section-head {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-bottom: 12px;
}
.dept-section-head h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--brand); }
.dept-section-head .count { font-size: 12px; color: var(--text-3); }

/* ROSTER */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.roster-tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.12s, transform 0.05s, box-shadow 0.12s;
}
.roster-tile:hover { border-color: var(--brand); box-shadow: 0 2px 8px rgba(24,44,77,0.10); }
.roster-tile:active { transform: translateY(1px); }
.roster-tile.no-feedback { background: var(--line-soft); border-style: dashed; cursor: default; }
.roster-tile.no-feedback:hover { border-color: var(--line); box-shadow: none; }
.roster-tile .name { font-family: var(--st-display); font-size: 15px; font-weight: 700; color: var(--ink-head); margin-bottom: 2px; }
.roster-tile .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-3); margin-bottom: 12px; }
.roster-tile .reviewer-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  background: var(--brand);
  color: #fff;
  padding: 4px 10px;
  border-radius: 100px;
  font-weight: 600;
}
.roster-tile .reviewer-count.below-threshold { background: var(--warn); }
.roster-tile .reviewer-count.no-feedback-pill { background: transparent; color: var(--text-3); border: 1px dashed var(--line); }
.roster-tile .latest-meta { font-size: 11px; color: var(--text-3); margin-top: 8px; }
.roster-empty { padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; }

/* SUBMISSIONS ADMIN LIST */
.submission-list { list-style: none; padding: 0; margin: 12px 0 0; }
.submission-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; gap: 12px; flex-wrap: wrap; }
.submission-list .meta { color: var(--text-3); font-size: 12px; }
.submission-list button { background: transparent; border: 1px solid var(--line); color: var(--text-2); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-family: inherit; }
.submission-list button:hover { background: var(--surface-2); color: var(--bad); }
.submission-list select { font-family: inherit; font-size: 12px; padding: 5px 8px; border-radius: 5px; border: 1px solid var(--line); }

/* UNMATCHED QUEUE */
.unmatched-banner { background: var(--warn-bg); border: 1px solid #ECC896; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #6B4110; }
.unmatched-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); flex-wrap: wrap; }
.unmatched-row:last-child { border-bottom: none; }
.unmatched-row .who { font-weight: 600; }
.unmatched-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.unmatched-actions select { font-family: inherit; font-size: 12px; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--line); }

/* COACH DETAIL */
.detail-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 12px; }
.detail-head .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; font-family: var(--st-display); }
.detail-head .who { display: flex; align-items: center; gap: 14px; }

.mode-toggle {
  display: inline-flex;
  background: var(--surface-2);
  border-radius: 100px;
  padding: 3px;
  font-size: 12px;
  font-weight: 600;
}
.mode-toggle button {
  font-family: inherit;
  background: transparent;
  border: none;
  padding: 6px 14px;
  border-radius: 100px;
  cursor: pointer;
  color: var(--text-2);
}
.mode-toggle button.active { background: var(--brand); color: #fff; }

/* QUESTION SECTION */
.q-section {
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.q-section:last-of-type { border-bottom: none; padding-bottom: 0; }
.q-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  background: var(--line-soft);
  border-left: 4px solid var(--brand);
  padding: 12px 14px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.q-head .q-title { font-family: var(--st-display); font-size: 15px; font-weight: 700; color: var(--ink-head); }
.q-head .q-sub { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.7px; margin-top: 3px; font-weight: 600; }

.score-block { text-align: right; }
.score-block .avg { font-family: var(--st-display); font-size: 22px; font-weight: 800; color: var(--ink-head); line-height: 1; }
.score-block .meta { font-size: 11px; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }
.score-block .range { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.score-block.empty .avg { color: var(--text-3); font-size: 14px; font-weight: 600; }

/* COMMENT */
.comment {
  background: var(--line-soft);
  border-left: 3px solid var(--brand);
  padding: 10px 12px;
  border-radius: 0 6px 6px 0;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 8px;
}
.comment .attribution { font-weight: 700; color: var(--ink-head); margin-right: 4px; font-style: normal; }
.comment .attribution.anonymous { color: var(--text-3); font-weight: 600; font-style: italic; }
.comment .body { font-style: italic; }
.no-comments { color: var(--text-3); font-size: 12px; font-style: italic; padding: 6px 0; }

/* GROUP / DEPARTMENT VIEW */
.dept-bars { display: grid; gap: 8px; margin-top: 14px; }
.dept-bar-row { display: grid; grid-template-columns: 1.4fr auto 60px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.bar-track { background: var(--line-soft); border-radius: 4px; height: 14px; position: relative; overflow: hidden; }
.bar-fill { position: absolute; top: 0; left: 0; bottom: 0; background: var(--brand); border-radius: 4px; transition: width 0.3s; }
.bar-fill.low { background: var(--bad); }
.bar-fill.mid { background: var(--warn); }
.bar-fill.high { background: var(--good); }
.dept-bar-row .label { color: var(--text); font-weight: 500; }
.dept-bar-row .num { font-weight: 700; color: var(--ink-head); text-align: right; }

/* BACK BUTTON */
.back-btn { background: transparent; border: 1px solid var(--line); color: var(--text-2); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; margin-bottom: 12px; }
.back-btn:hover { background: var(--surface-2); }

/* OVERLAY / MODAL (used for Manage staff) */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(22,35,59,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.overlay .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 560px; width: 100%; max-height: 86vh; overflow: auto; }
.overlay .modal h2 { margin-bottom: 4px; }
.overlay .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.field input[type=text], .field select {
  width: 100%; font-family: inherit; font-size: 14px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text);
}
.roster-manage-list { list-style: none; padding: 0; margin: 10px 0 0; }
.roster-manage-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; gap: 10px; }
.roster-manage-list .who { font-weight: 600; }
.roster-manage-list .meta { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }

.btn-primary { background: var(--bronze); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14px; }
.btn-primary:hover { background: var(--bronze-dark); }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 14px; }
.btn-ghost:hover { background: var(--surface-2); }

.pdf-banner {
  background: #FBF1DC;
  border: 1px solid var(--gold-hi);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #6B4F0C;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.error-banner {
  background: var(--bad-bg); border: 1px solid #E3B6AF; border-radius: 8px;
  padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--bad);
}

/* PRINT STYLES */
@media print {
  @page { margin: 12mm; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; }
  .topbar, .topbar-actions, .back-btn, .mode-toggle, .admin-only, .dropzone, .print-hide { display: none !important; }
  .shell { padding: 0 !important; max-width: 100% !important; }
  .card { box-shadow: none !important; border: 1px solid #d0d4d9 !important; margin-bottom: 10px !important; padding: 14px !important; break-inside: avoid; page-break-inside: avoid; }
  .q-section { break-inside: avoid; page-break-inside: avoid; }
  h1 { font-size: 20px !important; }
  h2 { font-size: 15px !important; }
  .pdf-banner { display: none !important; }
}

// STATE

const SUBMISSIONS_KEY = 'st_360_dashboard_submissions_v1';
const ROSTER_KEY = 'st_360_dashboard_roster_v1';
const state = {
  staff: [],          // empty cache — the PSG places people in as 360s arrive
  submissions: [],
  view: 'roster',
  selectedCoachId: null,
  attributedMode: true,  // true = PSG's own view with reviewer names; false = anonymised preview
  showManageRoster: false,
  editingSubmissionId: null, // set while assigning an unmatched submission
  // While the roster is still filling in, an unrecognised name from an
  // incoming PDF is added straight away (role/department unknown until
  // assigned) so their submission counts immediately. Once the group is a
  // known, fixed set of people, turn this off from Manage staff — from then
  // on an unrecognised name is held for manual assignment instead, which
  // catches typos and mismatches rather than quietly creating a new entry.
  autoAddUnmatched: true,
};
if (typeof window !== 'undefined') window.state = state;

//==============================================================================
// PERSISTENCE
//==============================================================================
function saveState() {
  try {
    localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify({ submissions: state.submissions }));
    localStorage.setItem(ROSTER_KEY, JSON.stringify({ staff: state.staff, autoAddUnmatched: state.autoAddUnmatched }));
  } catch (e) {}
}
function loadState() {
  try {
    const rawSub = localStorage.getItem(SUBMISSIONS_KEY);
    if (rawSub) { const d = JSON.parse(rawSub); if (d.submissions) state.submissions = d.submissions; }
  } catch (e) {}
  try {
    const rawRoster = localStorage.getItem(ROSTER_KEY);
    if (rawRoster) {
      const d = JSON.parse(rawRoster);
      if (d.staff) state.staff = d.staff;
      if (typeof d.autoAddUnmatched === 'boolean') state.autoAddUnmatched = d.autoAddUnmatched;
    }
  } catch (e) {}
}

//==============================================================================
// HELPERS
//==============================================================================
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function initials(name) {
  if (!name) return '?';
  return name.split(/\s+/).map(w => w[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
}
function getNested(obj, path) {
  return path.reduce((acc, k) => (acc == null ? acc : acc[k]), obj);
}
function normalizeName(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function staffById(id) { return state.staff.find(s => s.id === id); }
function departmentName(id) { const d = DEPARTMENTS.find(x => x.id === id); return d ? d.name : id; }
function roleLabel(key) { return key ? (ROLES[key] || key) : 'Needs a role'; }
function needsAssignment(p) { return !p.role || (!NO_DEPARTMENT_ROLES.includes(p.role) && !p.department); }
function submissionsFor(coachId) {
  return state.submissions.filter(s => s.recipient?.coachId === coachId);
}
function uid(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

//==============================================================================
// ROSTER MANAGEMENT — the cache starts empty. The PSG places people into it,
// grouped by the platform's own department/role framework, as 360 input
// starts coming in about them (or ahead of time, however suits).
//==============================================================================
function addStaff(name, roleKey, departmentId) {
  name = (name || '').trim();
  if (!name) return null;
  const person = {
    id: uid('staff'),
    name,
    role: roleKey,
    department: NO_DEPARTMENT_ROLES.includes(roleKey) ? null : (departmentId || null),
  };
  state.staff.push(person);
  saveState();
  return person;
}
function removeStaff(id) {
  const person = staffById(id);
  if (!person) return;
  const linked = submissionsFor(id).length;
  const msg = linked
    ? `Remove ${person.name} from the roster? ${linked} submission(s) already matched to them will go back to "unmatched" rather than being deleted.`
    : `Remove ${person.name} from the roster?`;
  if (!confirm(msg)) return;
  state.staff = state.staff.filter(s => s.id !== id);
  state.submissions.forEach(s => { if (s.recipient?.coachId === id) delete s.recipient.coachId; });
  saveState();
  render();
}

//==============================================================================
// AGGREGATION
//==============================================================================
function aggregateScores(subs, scoreKey) {
  const scores = subs.map(s => s.feedback?.scores?.[scoreKey]).filter(v => typeof v === 'number');
  if (scores.length === 0) return { count: 0, avg: null, min: null, max: null };
  const sum = scores.reduce((a, b) => a + b, 0);
  return {
    count: scores.length,
    avg: (sum / scores.length).toFixed(1),
    min: Math.min(...scores),
    max: Math.max(...scores),
  };
}

function collectComments(subs, textPath) {
  return subs
    .map(s => ({ text: getNested(s.feedback, textPath), reviewer: s.reviewer, relationship: s.relationship, submittedAt: s.submittedAt, recipient: s.recipient }))
    .filter(c => c.text && c.text.trim().length > 0);
}

//==============================================================================
// FILE INGEST — PDFs only. Each Performance 360 PDF carries its structured
// data embedded (invisibly) on its own final page, put there by the 360
// form at print time. There is no JSON upload path: the printed PDF the
// reviewer emails in is the one and only submission format.
//==============================================================================
function readSubmissionFile(file) {
  const isPdf = /\.pdf$/i.test(file.name || '') || file.type === 'application/pdf';
  if (!isPdf) return Promise.reject(new Error(`${file.name}: only PDF submissions are accepted here. This dashboard reads the Performance 360 PDF a reviewer prints and emails in — not the backup JSON some older tools produced.`));
  return extractJsonFromPdf(file);
}

async function extractJsonFromPdf(file) {
  if (typeof pdfjsLib === 'undefined') {
    throw new Error(`${file.name}: PDF reading isn't available right now (the PDF library did not load). Try again once you're back online.`);
  }
  let fullText;
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    fullText = text;
  } catch (e) {
    throw new Error(`${file.name}: could not read this PDF (${(e && e.message) || e}).`);
  }
  const m = fullText.match(/---BEGIN-360-DATA---([\s\S]*?)---END-360-DATA---/);
  if (!m) {
    throw new Error(`${file.name}: no embedded data page found in this PDF. It either wasn't printed by the Performance 360 form, or its last page (marked "Data page for the Performance 360 dashboard") was left out when it was saved. Ask the reviewer to reprint the whole thing and resend it.`);
  }
  const cleaned = m[1].replace(/[^A-Za-z0-9+/=]/g, ''); // base64 alphabet only — safe to strip
                                                          // everything else the PDF's line-wrapping
                                                          // may have introduced (spaces, newlines).
  let jsonStr;
  try { jsonStr = decodeURIComponent(escape(atob(cleaned))); }
  catch (e) { throw new Error(`${file.name}: the data on this PDF's last page could not be decoded.`); }
  let obj;
  try { obj = JSON.parse(jsonStr); }
  catch (e) { throw new Error(`${file.name}: the data on this PDF's last page did not parse as a valid submission.`); }
  return obj;
}

function ingestFiles(fileList) {
  const files = Array.from(fileList);
  const tasks = files.map(file => readSubmissionFile(file).then(
    obj => ({ ok: true, obj }),
    error => ({ ok: false, file, error })
  ));
  return Promise.all(tasks).then(results => {
    const oks = results.filter(r => r.ok).map(r => r.obj);
    const fails = results.filter(r => !r.ok);
    const { added, autoAdded } = mergeSubmissions(oks);
    return { added, autoAdded, fails };
  });
}
function matchRecipient(name) {
  const norm = normalizeName(name);
  const matches = state.staff.filter(s => normalizeName(s.name) === norm);
  return matches.length === 1 ? matches[0] : null;
}
function mergeSubmissions(incoming) {
  const existing = new Set(state.submissions.map(s => s.responseId));
  let added = 0, autoAdded = 0;
  for (const s of incoming) {
    if (!s) continue;
    if (s.kind !== '360') continue; // ignore non-360 payloads
    if (s.responseId && existing.has(s.responseId)) continue;
    if (!s.responseId) s.responseId = uid('360');
    let match = matchRecipient(s.recipient?.name);
    if (!match && state.autoAddUnmatched && (s.recipient?.name || '').trim()) {
      // Role and department are unknown from the PDF alone — the person is
      // added right away so their submission counts, but held in "needs
      // role & department" until the PSG assigns those.
      match = addStaff(s.recipient.name, null, null);
      autoAdded++;
    }
    if (match) s.recipient.coachId = match.id;
    state.submissions.push(s);
    existing.add(s.responseId);
    added++;
  }
  saveState();
  return { added, autoAdded };
}

function handleFiles(files) {
  ingestFiles(files).then(({ added, autoAdded, fails }) => {
    if (fails.length) {
      alert('Some files could not be read:\n\n' + fails.map(f => '• ' + f.error.message).join('\n'));
    } else if (added === 0) {
      alert('No new Performance 360 submissions found in those files.');
    } else if (autoAdded > 0) {
      alert(`${added} submission${added === 1 ? '' : 's'} added. ${autoAdded} ${autoAdded === 1 ? 'name wasn’t' : 'names weren’t'} on the roster yet, so ${autoAdded === 1 ? 'it was' : 'they were'} added automatically — give ${autoAdded === 1 ? 'them' : 'them each'} a role and department under "Needs role & department" below.`);
    }
    render();
  }).catch(err => {
    alert('Could not load file: ' + err.message);
  });
}

function removeSubmission(id) {
  if (!confirm('Remove this submission from the local store? (The underlying PDF stays put.)')) return;
  state.submissions = state.submissions.filter(s => s.responseId !== id);
  saveState();
  render();
}
function assignSubmission(responseId, coachId) {
  const sub = state.submissions.find(s => s.responseId === responseId);
  if (!sub) return;
  if (!coachId) { delete sub.recipient.coachId; }
  else { sub.recipient.coachId = coachId; }
  saveState();
  render();
}

function personRow(p) {
  return `
    <li>
      <span class="who">${escapeHtml(p.name)}</span>

      <button class="btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="removeStaff('${escapeHtml(p.id)}')">Remove</button>
    </li>

function onNewStaffRoleChange() {
  const role = document.getElementById('new-staff-role').value;
  document.getElementById('new-staff-dept-field').style.display = NO_DEPARTMENT_ROLES.includes(role) ? 'none' : '';
}
function onAddStaffClick() {
  const name = document.getElementById('new-staff-name').value;
  const role = document.getElementById('new-staff-role').value;
  const dept = document.getElementById('new-staff-dept').value;
  if (!name.trim()) { alert('Enter a name first.'); return; }
  addStaff(name, role, dept);
  render();
}
function groupStaffByDepartment() {
  const departments = {};
  const leadership = [];
  const needsAssignmentList = [];
  state.staff.forEach(p => {
    if (needsAssignment(p)) { needsAssignmentList.push(p); return; }
    if (NO_DEPARTMENT_ROLES.includes(p.role)) { leadership.push(p); return; }
    (departments[p.department] = departments[p.department] || []).push(p);
  });
  Object.values(departments).forEach(list => list.sort((a, b) => a.name.localeCompare(b.name)));
  leadership.sort((a, b) => a.name.localeCompare(b.name));
  needsAssignmentList.sort((a, b) => a.name.localeCompare(b.name));
  return { departments, leadership, needsAssignment: needsAssignmentList };
}

function renderRoster() {

  if (!state.submissions.length) return renderEmpty();

  const totalSubmissions = state.submissions.length;
  const uniqueRecipients = new Set(state.submissions.map(s => s.recipient?.coachId).filter(Boolean)).size;
  const aboveThreshold = state.staff.filter(s => submissionsFor(s.id).length >= PDF_MIN_REVIEWERS).length;

  const tile = (coach) => {
    const subs = submissionsFor(coach.id);
    const count = subs.length;
    const hasFeedback = count > 0;
    const above = count >= PDF_MIN_REVIEWERS;
    const latest = hasFeedback ? subs.slice().sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''))[0] : null;
    const latestDate = latest ? (latest.submittedAt || '').slice(0, 10) : '';
    if (!hasFeedback) {
      return `
        <div class="roster-tile no-feedback">
          <div class="name">${escapeHtml(coach.name)}</div>
          <div class="role">${escapeHtml(roleLabel(coach.role))}</div>
          <span class="reviewer-count no-feedback-pill">No input yet</span>
        </div>`;
    }
    return `
      <div class="roster-tile" onclick="selectCoach('${escapeHtml(coach.id)}')">
        <div class="name">${escapeHtml(coach.name)}</div>
        <div class="role">${escapeHtml(roleLabel(coach.role))}</div>
        <span class="reviewer-count ${above ? '' : 'below-threshold'}">${count} reviewer${count === 1 ? '' : 's'}${above ? ' · ready' : ` · ${PDF_MIN_REVIEWERS - count} below threshold`}</span>
        <div class="latest-meta">Latest: ${escapeHtml(latestDate)}</div>
      </div>`;
  };

  const grouped = groupStaffByDepartment();
  const sortByFeedback = (list) => list.slice().sort((a, b) => {
    const ca = submissionsFor(a.id).length, cb = submissionsFor(b.id).length;
    if ((ca === 0) !== (cb === 0)) return ca === 0 ? 1 : -1;
    return cb - ca;
  });

  return `
    <div class="page-header">
      <div class="eyebrow">${escapeHtml(BRAND.orgLabel)} · Performance 360 dashboard</div>
      <h1>360 input received — ${totalSubmissions} submission${totalSubmissions === 1 ? '' : 's'} across ${uniqueRecipients} ${uniqueRecipients === 1 ? 'colleague' : 'colleagues'}</h1>
      <p class="muted">Organised by department, matching the platform's own framework. Click a person to read their feedback. ${PDF_MIN_REVIEWERS}+ reviewers required before a summary is treated as ready; below threshold you can still read everything as it arrives.</p>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="v">${totalSubmissions}</div><div class="l">Total submissions</div></div>
      <div class="kpi"><div class="v">${uniqueRecipients}</div><div class="l">Colleagues with input</div></div>
      <div class="kpi"><div class="v">${aboveThreshold}</div><div class="l">Above threshold</div></div>
      <div class="kpi"><div class="v">${state.staff.length}</div><div class="l">On the roster</div></div>
    </div>

    ${renderUnmatchedBanner()}

    ${grouped.needsAssignment.length ? `
      <div class="unmatched-banner admin-only">
        <b>${grouped.needsAssignment.length} ${grouped.needsAssignment.length === 1 ? 'person' : 'people'} added automatically from a PDF, still need a role and department.</b>
        <p style="margin:4px 0 8px;color:inherit;">Their submissions already count. This just places them in the right section below.</p>
        ${grouped.needsAssignment.map(needsAssignmentRow).join('')}
      </div>
    ` : ''}

    ${grouped.leadership.length ? `
      <div class="dept-section">
        <div class="dept-section-head"><h3>Leadership</h3><span class="count">${grouped.leadership.length}</span></div>
        <div class="roster">${sortByFeedback(grouped.leadership).map(tile).join('')}</div>
      </div>
    ` : ''}
    ${DEPARTMENTS.map(d => {
      const list = grouped.departments[d.id];
      if (!list || !list.length) return '';
      return `
        <div class="dept-section">
          <div class="dept-section-head"><h3>${escapeHtml(d.name)}</h3><span class="count">${list.length}</span></div>
          <div class="roster">${sortByFeedback(list).map(tile).join('')}</div>
        </div>`;
    }).join('')}
    ${state.staff.length === 0 ? `<div class="roster-empty">No one on the roster yet. <a href="#" onclick="toggleManageRoster(true); return false;">Add staff</a> to start matching submissions to names.</div>` : ''}

    <div class="card admin-only" style="margin-top: 20px;">
      <h3>All submissions</h3>
      <ul class="submission-list">
        ${state.submissions.slice().reverse().map(s => `
          <li>
            <div>
              <b>${escapeHtml(s.reviewer?.name || 'Unknown')}</b> &rarr; <b>${escapeHtml(s.recipient?.name || 'Unknown')}</b>${!s.recipient?.coachId ? ' <span class="muted">(unmatched)</span>' : ''}
              <div class="meta">${escapeHtml((s.submittedAt || '').slice(0, 16).replace('T', ' '))} &middot; ID ${escapeHtml(s.responseId)}</div>
            </div>
            <button onclick="removeSubmission('${escapeHtml(s.responseId)}')">Remove</button>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

//==============================================================================
// RENDER — COACH DETAIL
//==============================================================================
function renderCoach() {
  const coach = staffById(state.selectedCoachId);
  if (!coach) { setView('roster'); return ''; }
  const subs = submissionsFor(coach.id);
  if (!subs.length) {
    return `<button class="back-btn" onclick="setView('roster')">&larr; Back</button>
            <div class="card"><h2>No input received for ${escapeHtml(coach.name)} yet.</h2></div>`;
  }

  const reviewerCount = subs.length;
  const aboveThreshold = reviewerCount >= PDF_MIN_REVIEWERS;
  const isAnonPreview = !state.attributedMode;
  const dates = subs.map(s => s.submittedAt).filter(Boolean).sort();
  const earliest = dates[0] ? dates[0].slice(0, 10) : '';
  const latest = dates[dates.length - 1] ? dates[dates.length - 1].slice(0, 10) : '';

  if (isAnonPreview && !aboveThreshold) {
    return `
      <button class="back-btn print-hide" onclick="setView('roster')">&larr; All staff</button>
      <div class="card">
        <div class="detail-head">
          <div class="who">
            <div class="avatar">${escapeHtml(initials(coach.name))}</div>
            <div>
              <div class="eyebrow">${escapeHtml(BRAND.orgLabel)} · 360 input</div>
              <h1>${escapeHtml(coach.name)}</h1>
              <div class="muted">${escapeHtml(roleLabel(coach.role))}${coach.department ? ' &middot; ' + escapeHtml(departmentName(coach.department)) : ''}</div>
            </div>
          </div>
          <div class="mode-toggle print-hide">
            <button class="${state.attributedMode ? 'active' : ''}" onclick="state.attributedMode = true; render();">Your view</button>
            <button class="${!state.attributedMode ? 'active' : ''}" onclick="state.attributedMode = false; render();">Anonymised preview</button>
          </div>
        </div>
        <div class="pdf-banner">
          <div>
            <b>Below threshold.</b> Currently ${reviewerCount} reviewer${reviewerCount === 1 ? '' : 's'}. At least ${PDF_MIN_REVIEWERS} required before a summary is ready to share. Switch to your own view to read what has come in so far.
          </div>
        </div>
      </div>
    `;
  }

  return `
    <button class="back-btn print-hide" onclick="setView('roster')">&larr; All staff</button>
    ${isAnonPreview ? `
      <div class="pdf-banner print-hide">
        <div><b>Anonymised preview.</b> Reviewer names are stripped. Use the Print button in the topbar to save as PDF.</div>
        <button class="btn-ghost" onclick="state.attributedMode = true; render();">Back to your view</button>
      </div>
    ` : ''}

    <div class="card">
      <div class="detail-head">
        <div class="who">
          <div class="avatar">${escapeHtml(initials(coach.name))}</div>
          <div>
            <div class="eyebrow">${escapeHtml(BRAND.orgLabel)} · 360 input</div>
            <h1>${escapeHtml(coach.name)}</h1>
            <div class="muted">${escapeHtml(roleLabel(coach.role))}${coach.department ? ' &middot; ' + escapeHtml(departmentName(coach.department)) : ''} &middot; ${reviewerCount} reviewer${reviewerCount === 1 ? '' : 's'} &middot; ${escapeHtml(earliest)}${earliest !== latest ? ' to ' + escapeHtml(latest) : ''}</div>
          </div>
        </div>
        <div class="mode-toggle print-hide">
          <button class="${state.attributedMode ? 'active' : ''}" onclick="state.attributedMode = true; render();">Your view</button>
          <button class="${!state.attributedMode ? 'active' : ''}" onclick="state.attributedMode = false; render();">Anonymised preview</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Input by section</h2>
      <p class="muted">${isAnonPreview ? 'This is the anonymised version, safe to share. Comments group by area with no reviewer attribution.' : 'You see every submission with reviewer attribution. Only you see this view.'}</p>
      ${QUESTION_SECTIONS.map(section => renderSection(section, subs, isAnonPreview)).join('')}
    </div>
  `;
}

function renderSection(section, subs, isAnonPreview) {
  const agg = section.scored ? aggregateScores(subs, section.id) : null;
  const comments = collectComments(subs, section.textPath);

  let scoreBlock;
  if (!section.scored) {
    scoreBlock = '<div class="score-block empty"><div class="avg">text only</div><div class="meta">no score</div></div>';
  } else if (agg.count === 0) {
    scoreBlock = '<div class="score-block empty"><div class="avg">—</div><div class="meta">no scores</div></div>';
  } else {
    scoreBlock = `
      <div class="score-block">
        <div class="avg">${agg.avg}<span style="font-size: 12px; color: var(--text-3); font-weight: 400;"> / 5</span></div>
        <div class="meta">Avg · ${agg.count} of ${subs.length}</div>
        <div class="range">Range ${agg.min}&ndash;${agg.max}</div>
      </div>
    `;
  }

  const commentBody = comments.length === 0
    ? '<div class="no-comments">No comments submitted for this area.</div>'
    : comments.map(c => `
        <div class="comment">
          ${isAnonPreview
            ? `<span class="attribution anonymous">Colleague:</span>`
            : `<span class="attribution">${escapeHtml(c.reviewer?.name || 'Unknown')}${c.relationship ? ` <span style="font-weight: 400; color: var(--text-3); font-size: 11px; font-style: italic;">(${escapeHtml(RELATIONSHIP_LABELS[c.relationship] || c.relationship)})</span>` : ''}:</span>`}
          <span class="body">&ldquo;${escapeHtml(c.text)}&rdquo;</span>
        </div>
      `).join('');

  return `
    <div class="q-section">
      <div class="q-head">
        <div>
          <div class="q-title">${escapeHtml(section.label)}</div>
          <div class="q-sub">${comments.length} of ${subs.length} ${comments.length === 1 ? 'comment' : 'comments'}</div>
        </div>
        ${scoreBlock}
      </div>
      ${commentBody}
    </div>
  `;
}

//==============================================================================
// RENDER — DEPARTMENT VIEW
//==============================================================================
function renderGroup() {
  if (!state.submissions.length) return renderEmpty();

  const allAggs = {};
  for (const q of QUESTION_SECTIONS) {
    if (!q.scored) continue;
    allAggs[q.id] = aggregateScores(state.submissions, q.id);
  }

  const reviewers = new Set(state.submissions.map(s => s.reviewer?.email || s.reviewer?.name).filter(Boolean));
  const reviewerCount = reviewers.size;

  const recipientCounts = state.staff.map(s => ({ coach: s, count: submissionsFor(s.id).length }));
  const aboveThresholdCount = recipientCounts.filter(r => r.count >= PDF_MIN_REVIEWERS).length;
  const someInputCount = recipientCounts.filter(r => r.count > 0).length;

  const bandClass = (avg) => {
    if (avg == null) return '';
    const v = parseFloat(avg);
    if (v < 2.5) return 'low';
    if (v < 3.5) return 'mid';
    return 'high';
  };

  return `
    <button class="back-btn print-hide" onclick="setView('roster')">&larr; All staff</button>

    <div class="page-header">
      <div class="eyebrow">${escapeHtml(BRAND.orgLabel)} · Department view</div>
      <h1>Team-wide 360 input</h1>
      <p class="muted">Aggregated across all ${state.submissions.length} submissions. This view is yours alone — not shared with staff. Use it for workshop planning and team-wide acknowledgements.</p>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="v">${state.submissions.length}</div><div class="l">Total submissions</div></div>
      <div class="kpi"><div class="v">${reviewerCount}</div><div class="l">Unique reviewers</div></div>
      <div class="kpi"><div class="v">${someInputCount}</div><div class="l">Colleagues with input</div></div>
      <div class="kpi"><div class="v">${aboveThresholdCount}</div><div class="l">Above threshold</div></div>
    </div>

    <div class="card">
      <h2>Score distributions across the staff</h2>
      <p class="muted">Average across every submission. Range is the lowest and highest individual rating seen anywhere in the dataset.</p>
      <div class="dept-bars">
        ${QUESTION_SECTIONS.filter(q => q.scored).map(q => {
          const a = allAggs[q.id];
          const w = a.avg == null ? 0 : (parseFloat(a.avg) / 5) * 100;
          return `
            <div class="dept-bar-row">
              <div class="label">${escapeHtml(q.label)}</div>
              <div class="bar-track"><div class="bar-fill ${bandClass(a.avg)}" style="width: ${w}%;"></div></div>
              <div class="num">${a.avg == null ? '—' : a.avg}${a.count > 0 ? `<span style="font-size: 10px; color: var(--text-3); margin-left: 4px;">${a.min}-${a.max}</span>` : ''}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h2>Themes by section</h2>
      <p class="muted">All comments grouped by area across every submission. Useful for spotting team-wide patterns. Reviewer attribution shown for your own pattern-reading.</p>
      ${QUESTION_SECTIONS.map(section => {
        const comments = collectComments(state.submissions, section.textPath);
        if (comments.length === 0) return '';
        return `
          <div class="q-section">
            <div class="q-head">
              <div>
                <div class="q-title">${escapeHtml(section.label)}</div>
                <div class="q-sub">${comments.length} comments across the staff</div>
              </div>
            </div>
            ${comments.map(c => {
              const aboutName = c.recipient?.name || '';
              return `
                <div class="comment">
                  <span class="attribution">${escapeHtml(c.reviewer?.name || 'Unknown')}</span>
                  <span style="font-size: 11px; color: var(--text-3); margin-right: 6px;">about ${escapeHtml(aboutName)}:</span>
                  <span class="body">&ldquo;${escapeHtml(c.text)}&rdquo;</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

//==============================================================================
// MAIN RENDER
//==============================================================================
function render() {
  renderTopbarActions();
  let html = '';
  if (state.view === 'coach') html = renderCoach();
  else if (state.view === 'group') html = renderGroup();
  else html = renderRoster();
  document.getElementById('root').innerHTML = html + renderManageRosterModal();
  setupDropzone();
  const roleSel = document.getElementById('new-staff-role');
  if (roleSel) onNewStaffRoleChange();
}

function setupDropzone() {
  const dz = document.getElementById('dropzone');
  if (!dz) return;
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); dz.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    if (ev === 'dragleave' && e.target !== dz) return;
    dz.classList.remove('dragover');
  }));
  dz.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
}

//==============================================================================
// INIT
//==============================================================================
loadState();

const input = document.createElement('input');
input.type = 'file';
input.id = 'hidden-file-input';
input.style.display = 'none';
input.multiple = true;
input.accept = '.pdf,application/pdf';
input.addEventListener('change', e => handleFiles(e.target.files));
document.body.appendChild(input);

// Page-level drag/drop
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

render();
</script>
</body>
</html>
